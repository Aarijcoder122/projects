<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="submitform" id="submitform">
        
        <div class="formname">
        <label for="">Name</label><br>
        <input type="text" class="name" id="name"><br>
        </div>

        <div class="formemail">
        <label for="">Email</label><br>
        <input type="email" class="Email" id="email"><br>
        </div>

        <div class="formrollno">
        <label for="">Roll no </label><br>
        <input type="text" class="rollno" id="rollno"><br>
        </div>

        <div class="formcourse">
        <label for="">Course</label><br>
        <input type="text" class="Course" id="Course"><br>
        </div>

        <div class="formcampusname">
        <label for="">Select Campus</label><br>
        <select name="" id="Campus">
            <option >Main Campus</option>
            <option >gulshan Campus</option>
        </select>
        </div>

        <button class="submintbutton" id="btn" type="submit" >Submint Form</button>

    </div>

    <div class="submintformdetails" id="submintformdetails">
        <div class="displayflexbox">
        <h3> Name :</h3> 
        <p class="username" id="username">Hello</p>
        </div>

        <div class="displayflexbox">
        <h3> Email :</h3> 
        <p class="useremail" id="useremail">Hello</p>
        </div>

        <div class="displayflexbox">
        <h3> Roll no :</h3> 
        <p class="userrollno" id="userrollno">Hello</p>
        </div>

        <div class="displayflexbox">
        <h3> Course :</h3> 
        <p class="usercourse" id="usercourse">Hello</p>
        </div>

        <div class="displayflexbox">
        <h3> Campus :</h3> 
        <p class="usercampus" id="usercampus">Hello</p>
        </div>

        <button id="backbtn" class="backbtn">Go back</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
